name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-go:
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # MTIX-74: the bookkeeping gate reads git history to find which
          # tickets had work land. A shallow checkout would leave it
          # seeing one commit and passing without checking anything, so
          # the gate hard-fails on a shallow clone rather than skipping —
          # this is what keeps it honest.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
      - run: go mod verify
      # MTIX-72: an explicit budget, chosen rather than inherited. This is
      # the heaviest invocation in CI and was the only one on Go's 10m
      # default while the others carry 8m/12m. internal/store/sqlite alone
      # runs ~312s here under -race (~104s locally), so a 2x runner blip
      # killed the job with no test having failed — a timeout that reads
      # as a test failure in the summary, and trains people to re-run
      # instead of read. 20m keeps ~4x headroom over the observed cost
      # while still killing a genuine hang: the package completes, so
      # this is duration, not deadlock.
      - run: go test $(go list ./... | grep -v node_modules) -race -count=1 -timeout 20m

  test-web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: cd web && npm ci && npx vitest run

  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
      # MTIX-71: `config verify` fetches its JSON schema from
      # golangci-lint.run, so any blip on that host reds every commit —
      # a gate that cries wolf trains people to ignore red, which is
      # worse than no gate. It did exactly that alongside a real test
      # failure, which nearly got dismissed as "the usual lint flake".
      # The linters themselves need no network: `run` is what gates the
      # code, and it still does. The trade-off recorded deliberately:
      # we lose the config-shape check, and a malformed .golangci.yml
      # now surfaces as `run` failing to start rather than as a schema
      # error.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          verify: false

  test-go-postgres-docker:
    # MTIX-95.51: the MTIX_PG_TEST_DSN-gated suites run on every push to main
    # and every pull request, with -race, against PostgreSQL 16 AND 17. Before
    # this, a push ran only the transport suite and `cmd/mtix -run
    # TestMultiProject`, so the rest of the gated suites (cmd/mtix, e2e) ran
    # only on a release tag, after the merge that broke them. MTIX-42: the
    # gated suites are the point; a skipped one is a false green, so the DSN is
    # always set here. Service image, credentials, DSN and the 20m go test
    # timeout mirror release.yml's test-go job.
    #
    # One job per (PG version, package): pg and pkg are both real matrix axes
    # (2 x 3 = 6 jobs; an include entry that carries only one of them would be
    # merged into every combination and collapse the matrix, so none is used
    # for pg or pkg). Each job has its own service container, so packages
    # never share a database concurrently: the gated tests in cmd/mtix and e2e
    # DROP and re-migrate the shared database, and `-p 1` serializes the
    # packages inside one job (see release.yml). Packages are separate jobs
    # only to keep each under its wall-clock budget and to show which package
    # failed. Timeouts: the go test limit is 20m (release.yml's) where the old
    # transport step had 8m and the old chaos job 12m, because -race over
    # cmd/mtix measured ~13 minutes locally; the job limit of 35m adds setup
    # headroom. The e2e run keeps -v, as the old chaos job had. Hermetic, no
    # external secrets. A red run is a PG-store or sync regression and must
    # never be merged around.
    name: pg-${{ matrix.pg }} ${{ matrix.pkg }}
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        pg: ["16", "17"]
        pkg:
          - ./cmd/mtix/
          - ./internal/store/postgres/transport/
          - ./e2e/...
        include:
          # Extra flag for the e2e package only; it matches an existing pkg
          # value, so it augments those two jobs rather than adding any.
          - pkg: ./e2e/...
            verbose: -v
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: mtix_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MTIX_PG_TEST_DSN: "postgres://postgres:ci@localhost:5432/mtix_ci?sslmode=disable"
      MTIX_PG_TEST_REQUIRE_SUPERUSER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
      - name: Run ${{ matrix.pkg }} against PostgreSQL ${{ matrix.pg }}
        run: go test ${{ matrix.pkg }} ${{ matrix.verbose }} -race -count=1 -p 1 -timeout 20m

  test-fault-injection:
    # NFR-2.8 conformance (MTIX-26.7): storage must survive disk-full and
    # kill -9 mid-write — either complete safely or fail-stop, never
    # silently corrupt. Runs on EVERY build; a red run here is a
    # durability regression and must never be merged around.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
      - name: Mount 16 MiB tmpfs fault volume
        run: |
          sudo mkdir -p /mnt/mtix-faultfs
          sudo mount -t tmpfs -o size=16m,mode=1777 tmpfs /mnt/mtix-faultfs
      - name: Run fault-injection suite
        env:
          MTIX_FAULTFS_DIR: /mnt/mtix-faultfs
        run: go test ./e2e/faultinject/ -tags=faultinject -count=1 -timeout=12m -v

  build:
    needs: [test-go, test-web, lint, test-go-postgres-docker, test-fault-injection]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Build web UI
        # rm before cp: internal/web/dist is tracked, so a bare
        # `cp -r dist ../internal/web/dist` nests the fresh build at
        # internal/web/dist/dist/ and leaves the committed files in place —
        # the //go:embed then ships the OLD bundle (MTIX-81). Mirrors the
        # Makefile's build-web target.
        #
        # Each command is its own statement, and the paths are workspace-
        # relative rather than ../ from web/. Under the default `bash -e`,
        # a failure inside a `cd x && ...` chain does NOT abort the script,
        # so the earlier one-line form could have reached `rm -rf ../...`
        # with the cwd still at the workspace root — resolving outside the
        # checkout. A bare `cd` on its own line does abort.
        run: |
          cd web
          npm ci
          npm run build
          cd "$GITHUB_WORKSPACE"
          rm -rf internal/web/dist
          cp -r web/dist internal/web/dist
      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOFLAGS: -mod=readonly
        run: go build -trimpath -o mtix ./cmd/mtix/
      - name: Verify binary
        run: ./mtix --version
